[package]
name = "daa-cli"
version = "0.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Command-line interface for DAA system"
repository = "https://github.com/ruvnet/daa"
homepage = "https://github.com/ruvnet/daa"
documentation = "https://docs.rs/daa-cli"
keywords = ["daa", "blockchain", "autonomous", "agents", "ai"]
categories = ["cryptography", "web-programming"]

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
colored = "2.2.0"
thiserror = "1.0.69"
tabled = "0.15.0"
daa-orchestrator = { path = "../daa-orchestrator", features = ["default"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.2", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "5.0.1"
toml = "0.8.23"
indicatif = "0.17.11"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
