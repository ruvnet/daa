# cargo-deny configuration (cargo-deny >= 0.16, config format version 2).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Version 2: every vulnerability and unsound advisory is an error unless it is
# listed in `ignore` below. Unmaintained crates are reported for workspace
# dependencies only; yanked crates are warnings.
unmaintained = "workspace"
yanked = "warn"
ignore = [
    # bincode 1.x is unmaintained (development ceased permanently); there is no
    # maintained release to move to. It is used by daa-compute for local
    # serialization only. Review again by 2027-05-01 (replace with postcard or
    # serde_json if the crate is still unmaintained then).
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained, no fixed release; review 2027-05-01" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    # Weak, file-level copyleft (attohttpc, colored, option-ext). The previous
    # config only warned on copyleft licenses, so this keeps that behaviour.
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
skip = [
    { name = "windows-sys", version = "*" },
    { name = "windows-targets", version = "*" },
    { name = "syn", version = "*" },
]
deny = [
    # Crates with known security issues
    { name = "openssl", version = "<0.10.45" },
    # Old chrono releases with the localtime_r soundness issue
    { name = "chrono", version = "<0.4.19" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
