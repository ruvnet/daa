name: Cross-Platform Builds

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  build-matrix:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux targets
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
            
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            # daa-napi is a Node-API addon (cdylib only); musl targets cannot
            # produce cdylibs, so it is left out of musl builds.
            cargo-flags: --workspace --exclude daa-napi
            
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            cargo-flags: --workspace --exclude daa-napi
            
          # macOS targets
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
            
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            
          # Windows targets
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
            
          - target: x86_64-pc-windows-gnu
            os: windows-latest
            cross: false
            # napi-build needs libnode.dll to link a windows-gnu addon.
            cargo-flags: --workspace --exclude daa-napi
            
          # Additional targets
          - target: wasm32-unknown-unknown
            os: ubuntu-latest
            cross: true
            
          # wasm32-wasi was renamed to wasm32-wasip1 (Rust 1.84).
          - target: wasm32-wasip1
            os: ubuntu-latest
            cross: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: Install cross
      if: matrix.cross
      uses: taiki-e/install-action@cross

    - name: Setup musl tools
      if: contains(matrix.target, 'musl')
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools

    - name: Build workspace (native)
      if: '!matrix.cross'
      run: |
        cargo build ${{ matrix.cargo-flags || '--workspace' }} --locked --target ${{ matrix.target }} --verbose

    - name: Build workspace (cross)
      if: matrix.cross && !contains(matrix.target, 'wasm')
      run: |
        cross build ${{ matrix.cargo-flags || '--workspace' }} --locked --target ${{ matrix.target }} --verbose

    - name: Build for WASM
      if: contains(matrix.target, 'wasm')
      run: |
        # Only build specific crates that support WASM
        cargo build --locked --package daa-rules --target ${{ matrix.target }} --verbose
        cargo build --locked --package daa-chain --target ${{ matrix.target }} --verbose

    - name: Run tests (native only)
      if: '!matrix.cross && !contains(matrix.target, ''wasm'')'
      run: |
        cargo test ${{ matrix.cargo-flags || '--workspace' }} --locked --target ${{ matrix.target }} --verbose

    - name: Build CLI binary
      if: '!contains(matrix.target, ''wasm'')'
      run: |
        if [[ "${{ matrix.cross }}" == "true" ]]; then
          cross build --locked --package daa-cli --target ${{ matrix.target }} --release
        else
          cargo build --locked --package daa-cli --target ${{ matrix.target }} --release
        fi

    - name: Test CLI binary (native only)
      if: '!matrix.cross && !contains(matrix.target, ''wasm'')'
      run: |
        ./target/${{ matrix.target }}/release/daa-cli --version
        ./target/${{ matrix.target }}/release/daa-cli --help

    - name: Prepare artifacts
      if: '!contains(matrix.target, ''wasm'')'
      run: |
        mkdir -p artifacts
        
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          cp target/${{ matrix.target }}/release/daa-cli.exe artifacts/daa-cli-${{ matrix.target }}.exe
        else
          cp target/${{ matrix.target }}/release/daa-cli artifacts/daa-cli-${{ matrix.target }}
        fi

    - name: Upload artifacts
      if: '!contains(matrix.target, ''wasm'')'
      uses: actions/upload-artifact@v4
      with:
        name: daa-cli-${{ matrix.target }}
        path: artifacts/*

  # Build check for the CLI image on each platform, on a native runner (no
  # QEMU). Nothing is pushed from here; publishing lives in docker.yml.
  build-docker-images:
    name: Build Docker Images (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile.cli
        platforms: ${{ matrix.platform }}
        push: false
        load: true
        tags: daa-cli:ci
        cache-from: type=gha,scope=cli-${{ matrix.platform }}
        cache-to: type=gha,mode=max,scope=cli-${{ matrix.platform }}

    - name: Smoke test image
      run: |
        docker run --rm daa-cli:ci --version
        docker run --rm daa-cli:ci --help

  build-alpine:
    name: Alpine Linux Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    container:
      image: alpine:latest

    steps:
    - name: Install dependencies
      run: |
        apk add --no-cache \
          bash \
          build-base \
          curl \
          git \
          openssl-dev \
          pkgconfig

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    # daa-napi is a Node-API cdylib, which musl hosts cannot produce.
    - name: Build on Alpine
      run: |
        . ~/.cargo/env
        cargo build --locked --workspace --exclude daa-napi --release

    - name: Test on Alpine
      run: |
        . ~/.cargo/env
        cargo test --locked --workspace --exclude daa-napi

    - name: Create Alpine artifact
      run: |
        mkdir -p artifacts
        cp target/release/daa-cli artifacts/daa-cli-alpine-x86_64

    - name: Upload Alpine artifact
      uses: actions/upload-artifact@v4
      with:
        name: daa-cli-alpine-x86_64
        path: artifacts/daa-cli-alpine-x86_64

  test-compatibility:
    name: Compatibility Tests (${{ matrix.os }})
    needs: build-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            artifact: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            artifact: aarch64-unknown-linux-gnu
          - os: macos-15
            artifact: aarch64-apple-darwin
          - os: windows-2022
            artifact: x86_64-pc-windows-msvc
          - os: windows-2025
            artifact: x86_64-pc-windows-msvc

    defaults:
      run:
        shell: bash

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: daa-cli-${{ matrix.artifact }}

    - name: Test binary compatibility
      run: |
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          ./daa-cli-${{ matrix.artifact }}.exe --version
          ./daa-cli-${{ matrix.artifact }}.exe --help
        else
          chmod +x daa-cli-${{ matrix.artifact }}
          ./daa-cli-${{ matrix.artifact }} --version
          ./daa-cli-${{ matrix.artifact }} --help
        fi

  performance-benchmarks:
    name: Cross-Platform Benchmarks
    needs: build-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: bench-${{ matrix.os }}

    - name: Run benchmarks
      run: |
        cargo bench --locked --workspace

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmarks-${{ matrix.os }}
        path: target/criterion/

  summary:
    name: Cross-Platform Summary
    needs: [build-matrix, build-docker-images, build-alpine, test-compatibility]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Check results
      run: |
        echo "Build Matrix: ${{ needs.build-matrix.result }}"
        echo "Docker Images: ${{ needs.build-docker-images.result }}"
        echo "Alpine Build: ${{ needs.build-alpine.result }}"
        echo "Compatibility: ${{ needs.test-compatibility.result }}"
        
        if [[ "${{ needs.build-matrix.result }}" != "success" ]]; then
          echo "❌ Build matrix failed"
          exit 1
        fi
        
        if [[ "${{ needs.build-docker-images.result }}" != "success" && "${{ needs.build-docker-images.result }}" != "skipped" ]]; then
          echo "❌ Docker build failed"
          exit 1
        fi
        
        if [[ "${{ needs.build-alpine.result }}" != "success" ]]; then
          echo "❌ Alpine build failed"
          exit 1
        fi
        
        if [[ "${{ needs.test-compatibility.result }}" != "success" ]]; then
          echo "❌ Compatibility tests failed"
          exit 1
        fi
        
        echo "✅ All cross-platform builds successful"