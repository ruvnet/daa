name: Docker Images

# Publishes the daa-cli image. The per-commit Docker build check runs in
# cross-platform.yml (native amd64 and arm64 runners); this workflow pushes
# images only for release tags or a manual run with push_images=true.
#
# Docker Hub publishing needs the DOCKER_USERNAME and DOCKER_PASSWORD repository
# secrets. Without them only ghcr.io is used.

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push images to registries'
        required: false
        type: boolean
        default: false

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKER: docker.io

permissions:
  contents: read

jobs:
  cli-image:
    name: Build CLI Image
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read
      packages: write

    env:
      PUSH: ${{ github.event_name == 'push' || github.event.inputs.push_images == 'true' }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      if: env.PUSH == 'true'
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      if: env.PUSH == 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY_GHCR }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to Docker Hub
      if: env.PUSH == 'true' && env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY_DOCKER }}
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ env.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ env.REGISTRY_GHCR }}/${{ github.repository }}-cli
          ${{ env.DOCKER_USERNAME != '' && format('{0}/{1}/daa-cli', env.REGISTRY_DOCKER, env.DOCKER_USERNAME) || '' }}
        tags: |
          type=ref,event=pr
          type=sha
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    # Pull requests build and smoke-test amd64 only; pushes build both
    # platforms.
    - name: Build image for smoke test
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile.cli
        platforms: linux/amd64
        load: true
        push: false
        tags: daa-cli:test
        cache-from: type=gha,scope=cli-publish
        cache-to: type=gha,mode=max,scope=cli-publish

    - name: Smoke test image
      run: |
        docker run --rm daa-cli:test --version
        docker run --rm daa-cli:test --help

    - name: Build and push multi-arch image
      if: env.PUSH == 'true'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile.cli
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=cli-publish
        cache-to: type=gha,mode=max,scope=cli-publish
