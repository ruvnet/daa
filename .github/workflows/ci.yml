name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - beta
          - nightly
        include:
          - rust: stable
            can-fail: false
          - rust: beta
            can-fail: false
          - rust: nightly
            can-fail: true

    continue-on-error: ${{ matrix.can-fail }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.rust }}

    - name: Check Cargo.toml format
      run: |
        cargo fmt --all -- --check

    - name: Run Clippy
      run: |
        cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

    - name: Build workspace
      run: |
        cargo build --locked --workspace --all-features --verbose

    - name: Run tests
      run: |
        cargo test --locked --workspace --all-features --verbose

    - name: Run doc tests
      run: |
        cargo test --locked --workspace --doc --all-features --verbose

    - name: Check documentation
      run: |
        cargo doc --locked --workspace --all-features --no-deps --document-private-items

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit and cargo-deny
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit,cargo-deny

    # Cargo.lock is committed, so the audit checks the exact dependency set
    # that CI builds and tests.
    - name: Security audit
      run: cargo audit

    - name: Check licenses and dependencies
      run: cargo deny --locked check

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Generate code coverage
      run: cargo llvm-cov --locked --workspace --lcov --output-path lcov.info

    # Codecov needs a CODECOV_TOKEN secret. Forks and repos without the secret
    # skip the upload instead of failing; the coverage run above still gates.
    - name: Upload coverage to Codecov
      if: ${{ env.CODECOV_TOKEN != '' }}
      uses: codecov/codecov-action@v5
      with:
        files: lcov.info
        token: ${{ env.CODECOV_TOKEN }}
        fail_ci_if_error: true

  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2

    # Only the [[bench]] targets (criterion) run here; `--output-format
    # bencher` is the text format github-action-benchmark's `cargo` tool reads.
    - name: Run benchmarks
      run: |
        set -o pipefail
        cargo bench --locked --workspace --bench '*' -- --output-format bencher | tee bench-output.txt

    # Results from the previous run on main are kept in the Actions cache and
    # used as the baseline, so no gh-pages branch is needed.
    - name: Restore benchmark baseline
      uses: actions/cache/restore@v4
      with:
        path: ./bench-cache
        key: benchmark-baseline-${{ github.sha }}
        restore-keys: benchmark-baseline-

    - name: Compare with baseline
      uses: benchmark-action/github-action-benchmark@v1
      with:
        tool: 'cargo'
        output-file-path: bench-output.txt
        external-data-json-path: ./bench-cache/benchmark-data.json
        alert-threshold: '200%'
        fail-on-alert: true
        summary-always: true

    - name: Save benchmark baseline
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ./bench-cache
        key: benchmark-baseline-${{ github.sha }}

  minimal-versions:
    name: Minimal Versions Check
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@nightly

    - name: Install cargo-hack and cargo-minimal-versions
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-hack,cargo-minimal-versions

    # --direct checks the lower bounds this workspace declares itself; the
    # minimal versions of transitive dependencies are their authors' to keep.
    - name: Check minimal versions
      run: cargo minimal-versions check --workspace --direct

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: daa_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Setup test environment
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/daa_test
        DAA_TEST_MODE: true
      run: |
        # Setup test database
        sudo apt-get update
        sudo apt-get install -y postgresql-client

        # Run integration tests
        cargo test --locked --workspace --test '*integration*' --all-features

    - name: Run orchestrator tests
      run: |
        cd daa-orchestrator
        cargo test --locked --all-features -- --test-threads=1

    - name: Test MCP integration
      run: |
        cd daa-mcp
        cargo test --locked --all-features --examples

  workspace-consistency:
    name: Workspace Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-machete
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-machete

    # Only the members of this workspace are checked. qudag/, prime-rust/,
    # daa-sdk/ and crates/ are separate projects that this workspace does not
    # build.
    - name: Check workspace dependencies
      run: |
        # Verify all workspace members build together
        cargo check --locked --workspace

        # Check for unused dependencies
        cargo machete $(cargo metadata --locked --no-deps --format-version 1 \
          | jq -r '.packages[].manifest_path | rtrimstr("/Cargo.toml")')

    - name: Verify version consistency
      run: |
        # Check that all workspace members share the workspace version
        WS_VERSION=$(grep -A3 '^\[workspace.package\]' Cargo.toml | grep '^version' | cut -d'"' -f2)
        echo "Expected version: $WS_VERSION"
        status=0
        while read -r name version; do
          if [ "$version" != "$WS_VERSION" ]; then
            echo "Version mismatch in $name: expected $WS_VERSION, got $version"
            status=1
          fi
        done < <(cargo metadata --locked --no-deps --format-version 1 \
          | jq -r '.packages[] | "\(.name) \(.version)"')
        exit $status

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Keep in sync with `rust-version` in [workspace.package] in Cargo.toml.
    - name: Install Rust 1.89.0 (MSRV)
      uses: dtolnay/rust-toolchain@1.89.0

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: msrv

    - name: Check with MSRV
      run: |
        cargo check --locked --workspace --all-features

    - name: Test with MSRV
      run: |
        cargo test --locked --workspace --all-features
