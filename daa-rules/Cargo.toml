[package]
name = "daa-rules"
version = "0.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/daa-hq/daa-sdk"
homepage = "https://daa.hq/"
documentation = "https://docs.rs/daa-rules"
keywords = ["daa", "blockchain", "rules", "engine", "policy"]
categories = ["cryptography", "web-programming", "development-tools"]
description = "Rules engine for DAA system providing policy enforcement and decision automation"

[dependencies]
# Workspace dependencies
# Only tokio's sync primitives are used; "full" would pull mio, which does not
# build for wasm32.
tokio = { version = "1.54.1", features = ["sync"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "1.0.69"
anyhow = "1.0.104"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
tracing = "0.1.44"
async-trait = "0.1.92"

# Rules engine specific dependencies
regex = "1.13.1"
chrono = { version = "0.4.45", features = ["serde"] }

[features]
default = ["basic"]
basic = []
# No scripting or database backend is implemented yet; the features are kept
# (empty) so downstream feature flags keep resolving.
scripting = []
database = []
full = ["basic", "scripting", "database"]

# uuid v4 needs a randomness source on wasm32-unknown-unknown (browser/JS hosts).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { version = "1.29.2", features = ["js"] }
